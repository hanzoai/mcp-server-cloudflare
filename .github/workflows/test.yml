name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test & Check
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syncpack lint
        run: pnpm check:deps
      - name: Run linter
        run: pnpm check:turbo
      - name: Run linter (formatting)
        run: pnpm check:format
      - name: Run tests
        run: pnpm test
